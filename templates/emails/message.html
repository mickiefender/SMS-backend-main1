<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }} - {{ school_name }}</title>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f8fafc; }
    .container { max-width: 600px; margin: 0 auto; background-color: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .header { background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%); padding: 30px; text-align: center; color: white; }
    .logo { height: 60px; max-width: 200px; margin-bottom: 10px; }
    .school-name { font-size: 24px; font-weight: 700; margin: 0; }
    .content { padding: 40px; }
    .message-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 20px; background: #dbeafe; color: #1e40af; }
    .title { font-size: 28px; font-weight: 700; color: #1e293b; margin-bottom: 16px; line-height: 1.3; }
    .sender-info { background: #f8fafc; padding: 20px; border-radius: 8px; margin-bottom: 24px; }
    .sender-label { color: #64748b; font-weight: 500; }
    .sender-name { font-weight: 600; color: #1e293b; font-size: 16px; }
    .message { font-size: 16px; line-height: 1.7; color: #475569; margin-bottom: 30px; }
    .cta-button { display: inline-block; background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%); color: white; padding: 14px 32px; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 16px; margin: 20px 0; }
    .footer { background: #f1f5f9; padding: 30px; text-align: center; font-size: 14px; color: #64748b; }
    @media (max-width: 600px) { .content { padding: 24px; } .title { font-size: 24px; } }
  </style>
</head>
<body>
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
    <tr>
      <td style="padding: 40px 20px;">
        <table role="presentation" class="container" cellspacing="0" cellpadding="0" border="0">
          <tr>
            <td class="header">
              {% if logo_url %}
                <img src="{{ logo_url }}" alt="{{ school_name }} Logo" class="logo" style="display: block;">
              {% endif %}
              <h1 class="school-name">{{ school_name }}</h1>
            </td>
          </tr>
          <tr>
            <td class="content">
              <span class="message-badge">New Message</span>
              <h1 class="title">{{ subject }}</h1>
              <div class="sender-info">
                <div><span class="sender-label">From:</span> <span class="sender-name">{{ sender_name }}</span></div>
                <div><span class="sender-label">Sent:</span> <span>{{ sent_at|date:'F d, Y \\a\\t g:i A' }}</span></div>
              </div>
              <div class="message">{{ content|safe }}</div>
              <a href="{{ frontend_url|default:'https://yourapp.com/dashboard/messages' }}" class="cta-button">View Messages</a>
            </td>
          </tr>
          <tr>
            <td class="footer">
              <p>&copy; {{ 'now'|date:'Y' }} {{ school_name }}. All rights reserved.</p>
              <p><a href="{{ frontend_url|default:'https://yourapp.com' }}" style="color: #475569;">{{ frontend_url|default:'yourapp.com' }}</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
