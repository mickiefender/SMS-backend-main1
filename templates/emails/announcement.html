<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - {{ school_name }}</title>
</head>
<body style="margin:0;padding:0;background-color:#EDEDED;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
      <td style="padding:32px 16px;">
        <!-- Header -->
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;margin:0 auto 24px auto;">
          <tr>
            <td align="left" style="vertical-align:middle;">
              {% if logo_url %}
                <img src="{{ logo_url }}" alt="{{ school_name }} Logo" style="height:40px;display:block;">
              {% else %}
                <span style="font-size:22px;font-weight:800;color:#AF0303;letter-spacing:-0.5px;">{{ school_name }}</span>
              {% endif %}
            </td>
            <td align="right" style="vertical-align:middle;">
              <a href="{{ frontend_url|default:'https://yourapp.com' }}/login" style="display:inline-block;padding:10px 24px;border:2px solid #AF0303;border-radius:8px;color:#AF0303;text-decoration:none;font-weight:700;font-size:14px;background-color:#FFFFFF;">Log In</a>
            </td>
          </tr>
        </table>

        <!-- Card -->
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;margin:0 auto;background-color:#FFFFFF;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.08);">
          <tr>
            <td style="padding:40px 32px;text-align:center;">
              <!-- Hero -->
              <div style="width:96px;height:96px;margin:0 auto 24px auto;border-radius:50%;background:linear-gradient(135deg,#AF0303 0%,#7A0000 100%);display:flex;align-items:center;justify-content:center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none"><path d="M3 10v4a1 1 0 0 0 1 1h2l4 4v-4h1.3l4.6 4H19a1 1 0 0 0 1-1V10a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z" fill="#FFFFFF"/><path d="M20 8c1.5 2 1.5 6 0 8" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/></svg>
              </div>

              <h1 style="margin:0 0 16px 0;font-size:28px;font-weight:800;color:#333333;line-height:1.3;">{{ title }}</h1>

              <div style="max-width:480px;margin:0 auto;font-size:16px;line-height:1.7;color:#555555;text-align:left;">
                {{ content|safe }}
              </div>

              <div style="margin:28px 0 0 0;">
                <a href="{{ frontend_url|default:'https://yourapp.com/dashboard' }}" style="display:inline-block;background-color:#AF0303;color:#FFFFFF;padding:14px 36px;text-decoration:none;border-radius:8px;font-weight:700;font-size:16px;">View Dashboard</a>
              </div>

              <p style="margin:32px 0 0 0;font-size:13px;color:#888888;">Posted by {{ created_by|default:'School Admin' }} on {{ created_at|date:'F d, Y \\a\\t g:i A' }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background-color:#FAFAFA;border-top:1px solid #E5E5E5;">
              <p style="margin:0 0 8px 0;text-align:center;font-size:14px;color:#666666;">
                <a href="[unsubscribe]" style="color:#666666;text-decoration:underline;">Unsubscribe</a>
              </p>
              <p style="margin:0;text-align:center;font-size:12px;color:#999999;">&copy; {{ 'now'|date:'Y' }} {{ school_name }}. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
